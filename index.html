<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbitration Case Management | MetaDesign Solutions</title>
<style>body{margin:0;background:#f6f4ef;font:16px system-ui,sans-serif;color:#202124}main{max-width:720px;margin:25vh auto;padding:24px;text-align:center}p{color:#777}</style>
</head>
<body>
<main role="status" aria-live="polite"><h1>Arbitration Case Study</h1><p>Loading the case study…</p></main>
<script>
(async function(){
  try {
    const files = Array.from({length:17},(_,i)=>'parts/part-'+String(i+1).padStart(2,'0')+'.txt');
    const pieces = await Promise.all(files.map(async file=>{
      const response = await fetch(file);
      if(!response.ok) throw new Error('Unable to load '+file+' ('+response.status+')');
      return response.text();
    }));
    const html = pieces.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.querySelector('main').innerHTML='<h1>Unable to load case study</h1><p>Please refresh the page or try again later.</p>';
    console.error(error);
  }
})();
</script>
</body>
</html>
